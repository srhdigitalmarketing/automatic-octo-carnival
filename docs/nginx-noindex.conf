# Optional noindex for files served directly by Nginx.
# Copy this directive ONLY into existing static-file/image location blocks.
# Do not include at server level or in PHP locations: that would override
# Settings > Site > Index / No Index for application pages.
# Leave the X-Robots-Tag header from PHP unchanged. Test nginx config before reload.
add_header X-Robots-Tag "noindex, nofollow, noimageindex, nosnippet" always;
